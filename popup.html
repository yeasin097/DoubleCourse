<!DOCTYPE html>

<html>

<head>
    <title>Course Duplicate Finder</title>
    <link rel="stylesheet" href="style.css">
    <style>

        body {
            width: 350px;
            padding: 15px;
            font-family: Arial, sans-serif;
        }

        h2 {
            margin-top: 0;
        }

        button {
            width: 100%;
            padding: 10px;
            cursor: pointer;
        }

        .result {
            margin-top: 15px;
        }

        .duplicate {
            padding: 8px;
            margin-top: 5px;
            border-radius: 5px;
            background: #fff3cd;
        }

        .exact {
            background: #f8d7da;
        }

    </style>
</head>

<body>

    <h2>Course Duplicate Finder</h2>

    <button id="scan">
        Scan Enrollment
    </button>

    <div id="result" class="result">
        Click Scan Enrollment
    </div>

    <script src="popup.js"></script>

</body>

</html>
